<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f3eb"><meta name="description" content="私人咖啡豆收藏、冲煮记录与配方手册"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./assets/icon.svg"><title>Coffee Archive — 我的咖啡手册</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans SC",system-ui,sans-serif;color:#302b25;background:#f6f3eb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:980px;margin:auto;min-height:100dvh}.top{display:flex;justify-content:space-between;align-items:center;padding:23px 22px 13px}.brand{font-family:Georgia,serif;letter-spacing:-.6px;font-size:24px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:2.2px;color:#8c8274}.muted{color:#81796e}.top button,.iconbtn{border:0;background:transparent;color:inherit;font-size:22px}.main{padding:10px 20px 105px}.hero{padding:24px 0 20px;border-bottom:1px solid #d9d1c3}.hero h1{font:normal 36px/1.12 Georgia,serif;letter-spacing:-1.2px;margin:9px 0}.stats{display:flex;gap:0;padding:24px 0}.stat{flex:1;padding-left:15px;border-left:1px solid #d7cec0}.stat:first-child{padding-left:0;border:0}.stat b{font:normal 28px Georgia,serif}.stat small{display:block;color:#847a6c;font-size:11px;margin-top:5px}.sectionhead{display:flex;justify-content:space-between;align-items:baseline;margin:17px 0}.sectionhead h2{font:normal 23px Georgia,serif;margin:0}.sectionhead button,.link{border:0;background:none;color:#786b55;text-decoration:underline;font-size:12px}.card{border:1px solid #ddd5c9;border-radius:13px;background:#faf8f3;padding:17px;margin:12px 0}.bean{display:flex;gap:16px;align-items:center}.beanpic{width:88px;height:108px;border-radius:8px;flex-shrink:0;object-fit:cover;background:linear-gradient(140deg,#cec4b2,#a18c73)}.beanpic.placeholder{display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-size:29px}.bean h3{margin:4px 0;font:normal 22px Georgia,serif}.chip{display:inline-block;font-size:11px;padding:5px 8px;margin:3px 3px 0 0;border-radius:20px;background:#eee9df;color:#655d51}.mini{font-size:12px;line-height:1.7}.meter{height:5px;border-radius:9px;background:#e5e0d5;margin-top:11px;overflow:hidden}.meter span{display:block;background:#89957b;height:100%}.actions{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:17px 0}.action{background:#eae5d9;border:0;text-align:left;padding:19px;border-radius:12px;color:#3c372f}.action strong{display:block;font-size:15px;margin-top:12px}.action small{display:block;color:#857b6e;margin-top:4px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#f6f3ebed;backdrop-filter:blur(16px);border-top:1px solid #ded7cb;z-index:10;display:flex;justify-content:center;padding:10px 6px max(10px,env(safe-area-inset-bottom))}.navinner{display:flex;width:100%;max-width:750px}.navitem{border:0;background:none;color:#8b8174;flex:1;font-size:10px;display:flex;flex-direction:column;gap:4px;align-items:center}.navitem i{font-size:22px;font-style:normal}.navitem.active{color:#354735;font-weight:700}.btn{border:0;border-radius:10px;background:#344438;color:white;padding:13px 16px;font-weight:600}.btn.secondary{background:#e7e2d7;color:#3e3a32}.btn.ghost{background:transparent;color:#665b4c;border:1px solid #d9d1c3}.btn.full{width:100%}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0}.field{width:100%;border:1px solid #dcd4c7;background:#fffdfa;color:#292820;padding:12px 13px;border-radius:10px;outline-color:#89957b}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg{margin:13px 0}.fg label{display:block;font-size:12px;color:#726a5d;margin-bottom:6px}.hint{font-size:11px;color:#938a7e;line-height:1.6}.tabs{display:flex;gap:6px;margin:15px 0}.tabs button{border:0;background:#e9e3d8;padding:10px 14px;border-radius:9px;color:#6f6559;flex:1}.tabs button.selected{background:#3b4c3e;color:white}.sheet{position:fixed;inset:0;background:#f6f3eb;z-index:20;overflow-y:auto;padding:22px max(20px,calc((100vw - 760px)/2)) 70px}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.sheethead h2{font:normal 28px Georgia,serif;margin:4px 0}.sheethead button{border:0;background:none;font-size:22px}.notice{border-radius:9px;background:#ece8db;padding:12px;font-size:12px;color:#655e50;margin:12px 0;line-height:1.7}.listline{padding:13px 0;border-bottom:1px solid #e2dbcf;display:flex;justify-content:space-between;gap:12px}.empty{text-align:center;padding:40px 18px;color:#8a8074}.empty b{display:block;font:normal 22px Georgia,serif;color:#4a433b;margin:10px}.timer{font:normal 66px Georgia,serif;text-align:center;padding:24px}.round{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#e8e3d7;color:#344438}.photo{width:100%;height:185px;object-fit:cover;border-radius:10px;margin:8px 0}.danger{color:#a14d40}.search{width:100%}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wrap{display:flex;gap:6px;flex-wrap:wrap}.break{white-space:pre-wrap}.splash{position:fixed;inset:0;z-index:90;background:#ede8dd;display:grid;place-items:center;text-align:center;transition:opacity .35s}.splash.hide{opacity:0;pointer-events:none}.splash img{width:min(75vw,310px);max-height:65vh}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#344438;color:white;border-radius:12px;padding:12px 20px;z-index:80;max-width:90%;font-size:13px}.hidden{display:none!important}@media(min-width:720px){.main{padding-left:40px;padding-right:40px}.cardlist{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cardlist>.card{margin:0}.hero h1{font-size:46px}.actions{max-width:540px}}@media(max-width:400px){.beanpic{width:70px;height:93px}.formrow{grid-template-columns:1fr}.brand{font-size:21px}}
</style></head><body>
<div id="splash" class="splash"><div><img src="./assets/splash.svg" alt="Coffee Archive"><p class="eyebrow">YOUR PRIVATE COFFEE JOURNAL</p></div></div>
<div class="app"><header class="top"><div><div class="eyebrow">PERSONAL COFFEE COLLECTION</div><div class="brand">Coffee Archive<span style="color:#ad9d81">.</span></div></div><button onclick="openSettings()" aria-label="设置">⚙</button></header><main class="main" id="main"></main></div><nav class="bottom"><div class="navinner" id="nav"></div></nav><div id="modal"></div><div id="toastarea"></div>
<script>
"use strict";
const KEY="coffee.archive.v1";const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();const today=()=>new Date().toLocaleDateString("en-CA");
let db={beans:[],lots:[],recipes:[],brews:[],adjustments:[],gear:[]};let page="home",search="",filter="all",detail=null,timerStart=null,timerElapsed=0,timerHandle=null;
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw&&Array.isArray(raw.beans)){db={...db,...raw}}}catch(e){console.warn(e)}}function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert("本地存储空间不足，可能是照片太大。请先导出备份并减少照片。");return false}}load();
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),fmt=n=>Number(n||0).toLocaleString("zh-CN",{maximumFractionDigits:1}),dt=s=>s?esc(s):"未填写";
const bean=id=>db.beans.find(x=>x.id===id),lot=id=>db.lots.find(x=>x.id===id);
function remaining(id){const x=lot(id);if(!x)return 0;let n=Number(x.weight||0);db.brews.filter(b=>b.lotId===id).forEach(b=>n-=Number(b.dose||0));db.adjustments.filter(a=>a.lotId===id).forEach(a=>n+=Number(a.delta||0));return Math.round(n*10)/10}
function stocked(){return db.lots.filter(l=>remaining(l.id)>0)}
function toast(s){$("#toastarea").innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>$("#toastarea").innerHTML="",2300)}
function go(p){page=p;search="";filter="all";render();scrollTo(0,0)}
function nav(){const items=[["home","⌂","首页"],["beans","◈","咖啡豆"],["brew","◉","冲煮"],["library","▤","资料库"]];$("#nav").innerHTML=items.map(x=>'<button class="navitem '+(page===x[0]?"active":"")+'" onclick="go(\''+x[0]+'\')"><i>'+x[1]+'</i>'+x[2]+'</button>').join("")}
function pill(s){return s?'<span class="chip">'+esc(s)+'</span>':""}
function beanTile(b){const lots=db.lots.filter(l=>l.beanId===b.id),stock=lots.reduce((s,l)=>s+Math.max(0,remaining(l.id)),0),original=lots.reduce((s,l)=>s+Number(l.weight||0),0);return '<article class="card bean" onclick="viewBean(\''+b.id+'\')" style="cursor:pointer">'+(b.photo?'<img class="beanpic" src="'+b.photo+'" alt="咖啡包装">':'<div class="beanpic placeholder">C</div>')+'<div style="flex:1;min-width:0"><div class="eyebrow">'+esc(b.country||"COFFEE")+" / "+esc(b.region||"ORIGIN")+'</div><h3>'+esc(b.name)+'</h3><div class="mini muted">'+esc(b.roaster||"未填写烘焙商")+'</div><div>'+pill(b.process)+pill(b.roast)+'</div><div class="mini" style="margin-top:7px">库存 '+fmt(stock)+' g · '+lots.length+' 个批次</div><div class="meter"><span style="width:'+Math.min(100,Math.max(0,original?stock/original*100:0))+'%"></span></div></div></article>'}
function head(t,n){return '<div class="sectionhead"><h2>'+t+'</h2>'+(n||"")+'</div>'}
function home(){const active=db.beans.filter(b=>db.lots.some(l=>l.beanId===b.id&&remaining(l.id)>0));const recent=[...db.brews].sort((a,b)=>b.created.localeCompare(a.created)).slice(0,3);return '<section class="hero"><div class="eyebrow">'+new Intl.DateTimeFormat("en",{month:"long",day:"numeric",year:"numeric"}).format(new Date())+'</div><h1>Your Coffee Journal.</h1><div class="muted mini">每一包咖啡豆，都有值得留下的故事。</div></section><div class="stats"><div class="stat"><b>'+stocked().length+'</b><small>在库批次</small></div><div class="stat"><b>'+db.beans.length+'</b><small>收藏咖啡豆</small></div><div class="stat"><b>'+db.brews.length+'</b><small>冲煮记录</small></div></div><div class="actions"><button class="action" onclick="addBean()"><span class="round">＋</span><strong>添加咖啡豆</strong><small>拍照或手动建档</small></button><button class="action" onclick="startBrew()"><span class="round">◉</span><strong>开始冲煮</strong><small>配方、计时与记录</small></button></div>'+head("Currently Brewing",'<button onclick="go(\'beans\')">查看全部 ↗</button>')+(active.length?'<div class="cardlist">'+active.slice(0,4).map(beanTile).join("")+'</div>':'<div class="empty"><b>你的咖啡收藏，从这里开始。</b>添加第一包咖啡豆，记录你的日常冲煮。</div>')+head("Recent Brews",'<button onclick="go(\'brew\')">全部日志 ↗</button>')+(recent.length?recent.map(b=>'<div class="listline"><div><strong>'+esc(bean(lot(b.lotId)?.beanId)?.name||"已删除的咖啡豆")+'</strong><div class="mini muted">'+dt(b.date)+' · '+fmt(b.dose)+'g / '+fmt(b.water)+'g · '+esc(b.method||"手冲")+'</div></div><button class="link" onclick="viewBrew(\''+b.id+'\')">查看</button></div>').join(""):'<p class="muted mini">还没有冲煮记录。</p>')}
function beans(){let list=db.beans.filter(b=>(b.name+" "+b.country+" "+b.region+" "+b.roaster+" "+b.flavors+" "+b.process).toLowerCase().includes(search.toLowerCase()));if(filter==="stock")list=list.filter(b=>db.lots.some(l=>l.beanId===b.id&&remaining(l.id)>0));return head("Bean Collection",'<button onclick="addBean()">＋ 添加</button>')+'<input class="field search" placeholder="搜索名称、烘焙商、国家、风味…" value="'+esc(search)+'" oninput="search=this.value;updateBeanList()"><div class="tabs"><button class="'+(filter==="all"?"selected":"")+'" onclick="filter=\'all\';render()">所有豆子</button><button class="'+(filter==="stock"?"selected":"")+'" onclick="filter=\'stock\';render()">当前库存</button></div><div id="beanlist">'+(list.length?'<div class="cardlist">'+list.map(beanTile).join("")+'</div>':'<div class="empty"><b>暂时没有匹配的咖啡豆</b>试试添加第一包吧。</div>')+'</div>'}
function updateBeanList(){const list=db.beans.filter(b=>(b.name+" "+b.country+" "+b.region+" "+b.roaster+" "+b.flavors+" "+b.process).toLowerCase().includes(search.toLowerCase())&&(filter!=="stock"||db.lots.some(l=>l.beanId===b.id&&remaining(l.id)>0)));$("#beanlist").innerHTML=list.length?'<div class="cardlist">'+list.map(beanTile).join("")+'</div>':'<div class="empty">没有匹配结果</div>'}
function brewPage(){return head("Brew Journal",'<button onclick="startBrew()">＋ 开始冲煮</button>')+'<div class="actions"><button class="action" onclick="startBrew()"><span class="round">◷</span><strong>冲煮并计时</strong><small>记录实际参数</small></button><button class="action" onclick="editRecipe()"><span class="round">▤</span><strong>新建配方</strong><small>保存常用冲煮方案</small></button></div>'+head("My Recipes")+(db.recipes.filter(r=>!r.external).length?db.recipes.filter(r=>!r.external).map(recipeLine).join(""):'<p class="mini muted">暂时没有我的配方。</p>')+head("Brew History")+(db.brews.length?[...db.brews].reverse().map(b=>'<div class="listline"><div><strong>'+esc(bean(lot(b.lotId)?.beanId)?.name||"已删除的咖啡豆")+'</strong><div class="mini muted">'+dt(b.date)+' · '+fmt(b.dose)+'g / '+fmt(b.water)+'g · '+esc(b.method)+'</div></div><button class="link" onclick="viewBrew(\''+b.id+'\')">详情</button></div>').join(""):'<p class="mini muted">完成第一杯后，冲煮历史就会出现在这里。</p>')}
function recipeLine(r){return '<div class="listline"><div><strong>'+esc(r.title)+'</strong><div class="mini muted">'+esc(r.method||"手冲")+' · '+fmt(r.dose)+'g / '+fmt(r.water)+'g · '+esc(r.source||"个人配方")+'</div></div><button class="link" onclick="viewRecipe(\''+r.id+'\')">查看</button></div>'}
function library(){return head("Recipe Library",'<button onclick="editRecipe(null,true)">＋ 收藏配方</button>')+'<p class="muted mini">收集烘焙商、咖啡师与朋友分享的冲煮建议；保留原始链接。</p>'+ (db.recipes.filter(r=>r.external).length?db.recipes.filter(r=>r.external).map(recipeLine).join(""):'<div class="empty"><b>建立你的冲煮灵感库</b>可以手动整理截图和外部链接中的配方。</div>')}
function render(){nav();$("#main").innerHTML=({home,beans,brew:brewPage,library})[page]()}
function modal(title,body){$("#modal").innerHTML='<div class="sheet"><div class="sheethead"><div><div class="eyebrow">COFFEE ARCHIVE</div><h2>'+esc(title)+'</h2></div><button onclick="closeModal()" aria-label="关闭">×</button></div>'+body+'</div>';$(".sheet").scrollTop=0}
function closeModal(){stopTimer();$("#modal").innerHTML="";render()}
function val(id){return document.getElementById(id)?.value?.trim()||""}
function field(label,id,value="",type="text",placeholder=""){return '<div class="fg"><label for="'+id+'">'+label+'</label><input id="'+id+'" class="field" type="'+type+'" value="'+esc(value)+'" placeholder="'+esc(placeholder)+'"></div>'}
function area(label,id,value=""){return '<div class="fg"><label for="'+id+'">'+label+'</label><textarea id="'+id+'" class="field" rows="3">'+esc(value)+'</textarea></div>'}
function selectField(label,id,options,value){return '<div class="fg"><label for="'+id+'">'+label+'</label><select id="'+id+'" class="field">'+options.map(x=>'<option value="'+esc(x)+'" '+(x===value?"selected":"")+'>'+esc(x)+'</option>').join("")+'</select></div>'}
let pendingPhoto="";
function photoSection(){return '<div class="card"><div class="eyebrow">PACKAGING PHOTO</div><p class="mini">可上传照片保留在档案中。目前未连接 AI 图像识别服务，包装信息请手动核对录入。</p><input id="photo" class="field" type="file" accept="image/*" onchange="previewPhoto(this)"><img id="photoPreview" class="photo '+(!pendingPhoto?"hidden":"")+'" src="'+pendingPhoto+'" alt="包装预览"></div>'}
function previewPhoto(el){const file=el.files?.[0];if(!file)return;if(file.size>12e6){toast("图片请小于 12MB");return}const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),scale=Math.min(1,950/img.width,950/img.height);c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext("2d").drawImage(img,0,0,c.width,c.height);pendingPhoto=c.toDataURL("image/jpeg",.72);$("#photoPreview").src=pendingPhoto;$("#photoPreview").classList.remove("hidden")};img.src=URL.createObjectURL(file)}
function addBean(id){const b=bean(id)||{};pendingPhoto=b.photo||"";modal(id?"编辑咖啡豆":"添加咖啡豆",'<div class="tabs"><button class="selected" type="button" onclick="toast(\'照片保存在档案中；AI 识别功能将在后续接入\')">拍照 / 图片</button><button type="button" onclick="document.getElementById(\'bn\').focus()">手动填写</button></div>'+photoSection()+field("咖啡豆名称 *","bn",b.name)+field("烘焙商","br",b.roaster)+ '<div class="formrow">'+field("国家 / Country","bc",b.country)+field("产区 / Region","bg",b.region)+'</div>'+field("庄园 / 处理站","bf",b.farm)+field("豆种 / Variety","bv",b.variety)+field("海拔 (m)","ba",b.altitude,"text")+ '<div class="formrow">'+selectField("处理法","bp",["未知","水洗","日晒","蜜处理","厌氧","其他"],b.process||"未知")+selectField("烘焙度","bo",["未知","浅烘","中浅烘","中烘","中深烘","深烘"],b.roast||"未知")+'</div>'+field("风味标签 (逗号分隔)","bt",b.flavors)+area("备注","bnote",b.note)+ '<button class="btn full" onclick="saveBean(\''+(id||"")+'\')">'+(id?"保存修改":"下一步：购买批次")+'</button>')}
function saveBean(id){if(!val("bn")){toast("请填写咖啡豆名称");return}const payload={name:val("bn"),roaster:val("br"),country:val("bc"),region:val("bg"),farm:val("bf"),variety:val("bv"),altitude:val("ba"),process:val("bp"),roast:val("bo"),flavors:val("bt"),note:val("bnote"),photo:pendingPhoto};if(id){Object.assign(bean(id),payload);save();closeModal();viewBean(id)}else{const b={id:uid(),...payload,created:today()};db.beans.push(b);save();addLot(b.id,true)}}
function addLot(beanId,initial=false){modal(initial?"购买批次":"新增库存批次",'<div class="notice">'+esc(bean(beanId)?.name||"")+' · 同款豆子不同烘焙日期分别管理</div>'+field("本批次重量 (g) *","lw","200","number")+field("烘焙日期","ld",today(),"date")+field("购买日期","lp",today(),"date")+field("购买价格 (可选)","lprice","","number")+selectField("币种","lcurrency",["SGD","CNY","HKD","USD","EUR","JPY"],"SGD")+selectField("状态","ls",["未开封","饮用中","冷冻","已喝完"],"未开封")+field("开封日期 (可选)","lo","","date")+area("存放位置与备注","ln")+ '<button class="btn full" onclick="saveLot(\''+beanId+'\')">保存咖啡豆与库存</button>')}
function saveLot(beanId){const w=Number(val("lw"));if(!Number.isFinite(w)||w<=0){toast("重量必须大于 0");return}db.lots.push({id:uid(),beanId,weight:w,roastDate:val("ld"),purchaseDate:val("lp"),price:val("lprice"),currency:val("lcurrency"),status:val("ls"),openDate:val("lo"),note:val("ln")});save();closeModal();viewBean(beanId);toast("咖啡豆已保存")}
function viewBean(id){const b=bean(id);if(!b)return;const lots=db.lots.filter(l=>l.beanId===id);modal(b.name,(b.photo?'<img class="photo" src="'+b.photo+'" alt="咖啡包装">':'')+'<div class="eyebrow">'+esc(b.country||"ORIGIN")+' / '+esc(b.region||"REGION")+'</div><h2 style="font:normal 28px Georgia,serif;margin:9px 0">'+esc(b.name)+'</h2><p class="mini muted">'+esc(b.roaster||"未填写烘焙商")+'</p><div class="wrap">'+[b.process,b.roast,b.variety,...(b.flavors||"").split(/[,，]/)].map(pill).join("")+'</div><div class="card mini"><strong>咖啡档案</strong><div class="listline">庄园 / 处理站 <span>'+esc(b.farm||"—")+'</span></div><div class="listline">海拔 <span>'+esc(b.altitude||"—")+'</span></div><p class="break">'+esc(b.note||"")+'</p></div><div class="toolbar"><button class="btn secondary" onclick="addBean(\''+id+'\')">编辑资料</button><button class="btn" onclick="addLot(\''+id+'\')">＋ 入库批次</button><button class="btn ghost" onclick="startBrew(\''+id+'\')">开始冲煮</button></div>'+head("购买批次")+(lots.length?lots.map(l=>'<div class="card"><div style="display:flex;justify-content:space-between"><strong>'+dt(l.roastDate)+' 烘焙</strong><span class="chip">'+esc(l.status)+'</span></div><div class="mini muted">'+fmt(remaining(l.id))+' / '+fmt(l.weight)+' g · '+esc(l.note||"")+'</div><div class="meter"><span style="width:'+Math.max(0,Math.min(100,remaining(l.id)/l.weight*100))+'%"></span></div><div class="toolbar"><button class="btn secondary" onclick="adjustLot(\''+l.id+'\')">校准库存</button><button class="btn ghost" onclick="editLot(\''+l.id+'\')">批次资料</button></div></div>').join(""):'<p class="muted mini">尚未添加库存批次。</p>')+head("冲煮记录")+(db.brews.filter(x=>lots.some(l=>l.id===x.lotId)).slice(-5).reverse().map(x=>'<div class="listline"><span>'+dt(x.date)+' · '+fmt(x.dose)+'g / '+fmt(x.water)+'g</span><button class="link" onclick="viewBrew(\''+x.id+'\')">查看</button></div>').join("")||'<p class="muted mini">还没有冲煮记录。</p>')+'<hr style="border:0;border-top:1px solid #ddd5c9;margin-top:22px"><button class="link danger" onclick="deleteBean(\''+id+'\')">删除咖啡豆及相关记录</button>')}
function editLot(id){const l=lot(id);if(!l)return;modal("批次资料",field("原始重量 (g)","lw",l.weight,"number")+field("烘焙日期","ld",l.roastDate,"date")+field("购买日期","lp",l.purchaseDate,"date")+field("价格","lprice",l.price,"number")+selectField("币种","lcurrency",["SGD","CNY","HKD","USD","EUR","JPY"],l.currency)+selectField("状态","ls",["未开封","饮用中","冷冻","已喝完"],l.status)+field("开封日期","lo",l.openDate,"date")+area("备注","ln",l.note)+'<button class="btn full" onclick="applyLot(\''+id+'\')">保存批次</button>')}
function applyLot(id){const l=lot(id),w=Number(val("lw"));if(!(w>0)){toast("请输入有效重量");return}Object.assign(l,{weight:w,roastDate:val("ld"),purchaseDate:val("lp"),price:val("lprice"),currency:val("lcurrency"),status:val("ls"),openDate:val("lo"),note:val("ln")});save();viewBean(l.beanId)}
function adjustLot(id){const l=lot(id);modal("库存校准",'<div class="notice">当前计算剩余 '+fmt(remaining(id))+' g。修改后将保留一条库存变动历史。</div>'+field("实际剩余重量 (g) *","actual",remaining(id),"number")+field("原因","reason","","text","漏记冲煮、称重校准等")+'<button class="btn full" onclick="applyAdjust(\''+id+'\')">保存校准</button>')}
function applyAdjust(id){const n=Number(val("actual"));if(!Number.isFinite(n)||n<0){toast("请输入有效重量");return}db.adjustments.push({id:uid(),lotId:id,delta:Math.round((n-remaining(id))*10)/10,reason:val("reason"),date:today()});save();viewBean(lot(id).beanId)}
function deleteBean(id){if(!confirm("删除后该豆子、库存及对应冲煮日志也会删除。建议先备份。确认删除？"))return;const lotIds=db.lots.filter(l=>l.beanId===id).map(l=>l.id);db.beans=db.beans.filter(b=>b.id!==id);db.lots=db.lots.filter(l=>l.beanId!==id);db.brews=db.brews.filter(b=>!lotIds.includes(b.lotId));db.adjustments=db.adjustments.filter(a=>!lotIds.includes(a.lotId));save();closeModal();go("beans")}
let brewEdit="",brewTimerStatus=false;
function startBrew(beanId="",brewId=""){if(!stocked().length){toast("请先添加有库存的咖啡豆");return}const old=db.brews.find(b=>b.id===brewId),lots=stocked().filter(l=>!beanId||l.beanId===beanId);if(old&&!lots.some(l=>l.id===old.lotId))lots.push(lot(old.lotId));const prior=old||[...db.brews].reverse().find(b=>lots.some(l=>l.id===b.lotId))||{};brewEdit=brewId;timerElapsed=0;const opts=lots.map(l=>'<option value="'+l.id+'" '+(l.id===(old?.lotId||prior.lotId)?"selected":"")+'>'+esc(bean(l.beanId)?.name||"咖啡豆")+' · '+dt(l.roastDate)+' ('+fmt(remaining(l.id))+'g)</option>').join("");modal(brewId?"编辑冲煮记录":"开始冲煮",'<div class="eyebrow">BREW SESSION</div>'+ '<div class="fg"><label>使用咖啡豆批次</label><select class="field" id="blot" onchange="updateBrewStock()">'+opts+'</select></div><div id="bstock" class="hint"></div><div class="toolbar"><button class="btn secondary" onclick="applyRecipeSelect()">调用收藏配方</button><select id="recipePick" class="field" style="flex:1;max-width:220px"><option value="">选择配方</option>'+db.recipes.map(r=>'<option value="'+r.id+'">'+esc(r.title)+'</option>').join("")+'</select></div><div class="formrow">'+field("咖啡粉 (g) *","bdose",prior.dose||15,"number")+field("注水量 (g) *","bwater",prior.water||240,"number")+'</div><div class="formrow">'+field("水温 °C","btemp",prior.temp||92,"number")+field("总时长 (秒)","bduration",prior.duration||"","number")+'</div><div class="formrow">'+selectField("冲煮方式","bmethod",["V60","Origami","Kalita","爱乐压","法压","冷萃","意式","其他"],prior.method||"V60")+field("研磨设置","bgrind",prior.grind||"")+'</div>'+field("冲煮日期","bdate",prior.date||today(),"date")+'<div class="card"><div class="eyebrow">BREW TIMER · 冲煮计时</div><div id="timer" class="timer">00:00</div><div class="toolbar" style="justify-content:center"><button class="btn secondary" onclick="toggleTimer()" id="timerBtn">开始计时</button><button class="btn ghost" onclick="resetTimer()">重置</button><button class="btn ghost" onclick="useTimer()">填入时间</button></div><p class="hint">切到其他应用时，计时基于实际时间差计算；页面关闭后计时不会继续保存。</p></div>'+selectField("这杯的评价","brating",["未评价","非常喜欢","不错","需要调整"],prior.rating||"未评价")+area("感官记录与下次调整","bnotes",prior.notes||"")+'<button class="btn full" onclick="saveBrew()">保存完成的冲煮 · 扣减库存</button><p class="hint">配方模板本身不会扣减库存；只有完成的冲煮日志才会扣减。</p>');updateBrewStock()}
function updateBrewStock(){const l=lot(val("blot"));if($("#bstock"))$("#bstock").textContent=l?"本批次当前剩余 "+fmt(remaining(l.id))+" g":""}
function applyRecipeSelect(){const r=db.recipes.find(x=>x.id===val("recipePick"));if(!r){toast("请先选择配方");return}$("#bdose").value=r.dose||15;$("#bwater").value=r.water||240;$("#btemp").value=r.temp||92;$("#bmethod").value=r.method||"V60";$("#bgrind").value=r.grind||"";toast("配方参数已填入")}
function toggleTimer(){if(timerStart){timerElapsed+=Date.now()-timerStart;timerStart=null;clearInterval(timerHandle);$("#timerBtn").textContent="继续计时"}else{timerStart=Date.now();timerHandle=setInterval(drawTimer,250);$("#timerBtn").textContent="暂停"}drawTimer()}
function drawTimer(){const sec=Math.floor((timerElapsed+(timerStart?Date.now()-timerStart:0))/1000);if($("#timer"))$("#timer").textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function resetTimer(){timerElapsed=0;timerStart=null;clearInterval(timerHandle);drawTimer();$("#timerBtn").textContent="开始计时"}
function useTimer(){$("#bduration").value=Math.floor((timerElapsed+(timerStart?Date.now()-timerStart:0))/1000);toast("已填入冲煮时长")}
function stopTimer(){clearInterval(timerHandle);timerStart=null;timerElapsed=0}
function saveBrew(){const l=lot(val("blot")),dose=Number(val("bdose")),water=Number(val("bwater")),old=db.brews.find(b=>b.id===brewEdit);if(!l||!(dose>0)||!(water>0)){toast("请选择批次并填写有效粉量与水量");return}const available=remaining(l.id)+(old?.lotId===l.id?Number(old.dose):0);if(dose>available+0.00001){toast("库存不足，请先校准重量或更换批次");return}const b={id:old?.id||uid(),lotId:l.id,dose,water,temp:val("btemp"),duration:val("bduration"),method:val("bmethod"),grind:val("bgrind"),date:val("bdate")||today(),rating:val("brating"),notes:val("bnotes"),created:old?.created||new Date().toISOString()};if(old)Object.assign(old,b);else db.brews.push(b);if(l.status==="未开封")l.status="饮用中";save();closeModal();go("brew");toast("已保存冲煮，库存自动扣减 "+fmt(dose)+" g")}
function viewBrew(id){const b=db.brews.find(x=>x.id===id);if(!b)return;modal("冲煮详情",'<div class="eyebrow">'+dt(b.date)+'</div><h2>'+esc(bean(lot(b.lotId)?.beanId)?.name||"已删除")+'</h2><div class="card"><div class="listline">粉量 / 水量 <strong>'+fmt(b.dose)+' / '+fmt(b.water)+' g</strong></div><div class="listline">粉水比 <strong>1 : '+(b.water/b.dose).toFixed(1)+'</strong></div><div class="listline">水温 <strong>'+esc(b.temp||"—")+' °C</strong></div><div class="listline">方式 <strong>'+esc(b.method)+'</strong></div><div class="listline">研磨 <strong>'+esc(b.grind||"—")+'</strong></div><div class="listline">总时间 <strong>'+esc(b.duration||"—")+' 秒</strong></div><div class="listline">评价 <strong>'+esc(b.rating)+'</strong></div></div><p class="break">'+esc(b.notes||"")+'</p><div class="toolbar"><button class="btn" onclick="startBrew(\''+lot(b.lotId)?.beanId+'\',\''+id+'\')">编辑日志</button><button class="btn secondary" onclick="startBrew(\''+lot(b.lotId)?.beanId+'\')">复制再冲</button><button class="btn ghost danger" onclick="deleteBrew(\''+id+'\')">删除日志</button></div>')}
function deleteBrew(id){if(!confirm("删除日志会恢复该笔粉量到对应库存，确定删除？"))return;db.brews=db.brews.filter(b=>b.id!==id);save();closeModal();go("brew")}
function editRecipe(id,external=false){const r=db.recipes.find(x=>x.id===id)||{};modal(id?"编辑配方":external?"收藏外部配方":"我的冲煮配方",field("配方名称 *","rt",r.title,"text","例如 V60 三段注水")+selectField("配方类型","rext",["自己的配方","外部收藏"],r.external?"外部收藏":external?"外部收藏":"自己的配方")+field("作者 / 来源名称","rs",r.source)+field("原始链接","ru",r.url,"url","https://")+ '<div class="formrow">'+field("粉量 (g)","rd",r.dose||15,"number")+field("水量 (g)","rw",r.water||240,"number")+'</div><div class="formrow">'+field("水温 °C","rtemp",r.temp||92,"number")+field("研磨设置","rg",r.grind)+'</div>'+selectField("冲煮方式","rm",["V60","Origami","Kalita","爱乐压","法压","冷萃","意式","其他"],r.method||"V60")+area("注水步骤 / 说明","rnotes",r.notes)+'<p class="hint">截图识别功能以后接入。目前可保留原始链接，并手动整理配方数据。</p><button class="btn full" onclick="saveRecipe(\''+(id||"")+'\')">保存配方</button>')}
function saveRecipe(id){if(!val("rt")){toast("请输入配方名称");return}const r={id:id||uid(),title:val("rt"),external:val("rext")==="外部收藏",source:val("rs"),url:val("ru"),dose:Number(val("rd"))||0,water:Number(val("rw"))||0,temp:val("rtemp"),grind:val("rg"),method:val("rm"),notes:val("rnotes")};if(id)Object.assign(db.recipes.find(x=>x.id===id),r);else db.recipes.push(r);save();closeModal();go(r.external?"library":"brew");toast("配方已保存")}
function viewRecipe(id){const r=db.recipes.find(x=>x.id===id);if(!r)return;modal(r.title,'<div class="eyebrow">'+esc(r.source||"MY RECIPE")+'</div><div class="card"><div class="listline">冲煮方式 <strong>'+esc(r.method)+'</strong></div><div class="listline">粉量 / 水量 <strong>'+fmt(r.dose)+' / '+fmt(r.water)+' g</strong></div><div class="listline">水温 <strong>'+esc(r.temp||"—")+' °C</strong></div><div class="listline">研磨 <strong>'+esc(r.grind||"—")+'</strong></div></div><p class="break">'+esc(r.notes||"")+'</p>'+(r.url?'<p><a href="'+esc(/^https?:\/\//i.test(r.url)?r.url:"#")+'" target="_blank" rel="noopener noreferrer" class="link">访问原始来源 ↗</a></p>':"")+'<div class="toolbar"><button class="btn" onclick="editRecipe(\''+id+'\')">编辑配方</button><button class="btn ghost danger" onclick="deleteRecipe(\''+id+'\')">删除</button></div>')}
function deleteRecipe(id){if(!confirm("确定删除这个配方？"))return;db.recipes=db.recipes.filter(x=>x.id!==id);save();closeModal();render()}
function download(name,content,type){const a=document.createElement("a"),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function exportData(){download("coffee-archive-"+today()+".json",JSON.stringify({format:"coffee-archive",version:1,exported:new Date().toISOString(),...db},null,2),"application/json");toast("JSON 备份已导出")}
function csv(){const rows=[["日期","咖啡豆","烘焙商","使用粉量g","水量g","水温","冲煮方式","评价","备注"],...db.brews.map(b=>{const x=bean(lot(b.lotId)?.beanId);return[b.date,x?.name||"",x?.roaster||"",b.dose,b.water,b.temp,b.method,b.rating,b.notes]})];download("coffee-brews-"+today()+".csv","\ufeff"+rows.map(r=>r.map(c=>'"'+String(c??"").replaceAll('"','""')+'"').join(",")).join("\r\n"),"text/csv;charset=utf-8")}
function importData(el){const f=el.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!["beans","lots","recipes","brews","adjustments"].every(k=>Array.isArray(d[k])))throw Error("bad schema");if(!confirm("导入将覆盖当前本地数据。请确认你已备份现有记录。"))return;db={beans:d.beans,lots:d.lots,recipes:d.recipes,brews:d.brews,adjustments:d.adjustments,gear:Array.isArray(d.gear)?d.gear:[]};save();closeModal();go("home");toast("备份导入成功")}catch(e){toast("文件格式不正确，未导入")}};reader.readAsText(f)}
function openSettings(){modal("Settings / 设置",'<div class="card"><strong>关于存储</strong><p class="mini muted">这是离线优先的本地应用，数据保存在当前设备的浏览器中，不会自动跨设备同步。清除网站数据可能丢失记录。强烈建议定期导出 JSON 备份。</p></div><div class="toolbar"><button class="btn" onclick="exportData()">导出 JSON 备份</button><button class="btn secondary" onclick="csv()">导出冲煮 CSV</button></div><div class="fg"><label>从 JSON 备份恢复（覆盖现有数据）</label><input type="file" class="field" accept=".json,application/json" onchange="importData(this)"></div><div class="card"><strong>图标及启动页预留</strong><p class="mini muted">以后替换 assets/icon.svg 和 assets/splash.svg。正式 PNG 图标建议另外制作 192×192、512×512 和 180×180，并更新 manifest 和 Apple touch icon。</p></div><div class="card"><strong>AI 图片识别</strong><p class="mini muted">仅预留交互入口，未接入图像识别接口；所有记录均可手动添加。不要将 API 密钥写入公开的 GitHub Pages 前端。</p></div><div class="card"><strong>版本 v1.0</strong><p class="mini muted">私人的咖啡收藏、批次管理、配方手册、冲煮计时与自动库存扣减。</p></div>')}
render();setTimeout(()=>$("#splash")?.classList.add("hide"),650);setTimeout(()=>$("#splash")?.remove(),1200);
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.warn));
</script></body></html>
